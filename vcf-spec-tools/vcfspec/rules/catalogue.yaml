# vcf-spec-tools/vcfspec/rules/catalogue.yaml
# Every code the library can emit. source: docs | schema | table
# 'table' entries derive from VCF-Design-Studio (MIT), whose values come from the
# VCF Planning and Preparation Workbook static reference tables.
VCF-INPUT-UNRECOGNISED:
  severity: critical
  source: schema
  source_url: ""
  summary: "Document is neither a lab inventory nor a VCF SddcSpec."
  fix: "Add apiVersion and kind, or pass input_kind explicitly."
VCF-INPUT-BAD-KIND:
  severity: critical
  source: schema
  source_url: ""
  summary: "Unknown input_kind."
  fix: "Use 'inventory' or 'sddc_spec'."
VCF-NO-VALIDATION-RAN:
  severity: critical
  source: schema
  source_url: ""
  summary: "No validation layer actually ran, so this result cannot certify the document."
  fix: "This is a defensive fallback and indicates a bug -- report it with the input that triggered it. Do not treat 'valid' from this response as meaningful."
VCF-INPUT-UNREADABLE:
  severity: critical
  source: schema
  source_url: ""
  summary: "The document could not be read ({exc_type})."
  fix: "Provide a YAML or JSON mapping within the size, depth, alias and expanded-node limits."
VCF-INV-SCHEMA:
  severity: error
  source: schema
  source_url: ""
  summary: "The inventory does not match its schema."
  fix: "Correct the inventory."
VCF-SCHEMA:
  severity: error
  source: schema
  source_url: https://github.com/vmware/vcf-api-specs
  summary: "The spec does not match the VCF Installer schema."
  fix: "Correct the field."
VCF-SCHEMA-VERSION-UNKNOWN:
  severity: critical
  source: schema
  source_url: ""
  # Deliberately does NOT quote the requested version. Every rejected
  # version must produce a byte-identical envelope (findings 1/2: a
  # varying message is the last thing an existence oracle needs), and this
  # message is read by an AI agent, so an arbitrary caller-supplied string
  # is not reflected into it. The vendored set is named instead, which is
  # what a legitimate caller actually needs to know.
  summary: "The requested VCF version is not vendored in this installation. Vendored: {known}."
  fix: "Use a vendored VCF version, or omit vcf_version/--version to use the default. Vendor a new one first with scripts/vendor_schema.py."
VCF-SCHEMA-INTEGRITY:
  severity: critical
  source: schema
  source_url: ""
  # Finding 6: distinct from VCF-SCHEMA-VERSION-UNKNOWN, which is a
  # retryable bad argument. This one means the schema shipped inside the
  # installation no longer hashes to its recorded checksum -- tampering or
  # a corrupt install, never a caller mistake. It must not be translated
  # to VCF-MCP-BAD-ARGS, and retrying it is pointless.
  summary: "Integrity check FAILED for the vendored VCF {version} schema: its contents do not match the checksum shipped with this installation. This is not a problem with the request."
  fix: "Do not retry. Treat this installation as compromised until proven otherwise: reinstall vcfspec from a trusted source, or re-vendor the schema with scripts/vendor_schema.py and review the diff."
VCF-VERSION-NOT-CONSULTED:
  severity: info
  source: schema
  source_url: ""
  # Does not quote the supplied version, for the same reason
  # VCF-SCHEMA-VERSION-UNKNOWN does not: the caller of this tool is an AI
  # agent that may be validating a document from an untrusted source, and
  # handing it back caller-chosen characters inside a message it reads is
  # a surface with no upside. The operator learns both things they needed
  # -- their version was ignored, and what this package actually ships.
  summary: "A non-default vcf_version was supplied but not consulted: this document validated as a lab inventory, which has one fixed schema regardless of VCF release. Vendored: {known}."
  fix: "Omit vcf_version when validating an inventory document, or pass input_kind: \"sddc_spec\" if you meant to validate a rendered spec instead."
VCF-CRED-NOT-A-REFERENCE:
  severity: critical
  source: docs
  source_url: ""
  summary: "A credential field holds something other than a ${reference}."
  fix: "Use ${name}; these tools never hold secrets."
VCF-RENDER-UNMAPPED:
  severity: critical
  source: schema
  source_url: ""
  summary: "A required spec field has no inventory source and no default."
  fix: "Add the missing inventory section."
VCF-RENDER-WRONG-KIND:
  severity: error
  source: schema
  source_url: ""
  summary: "render() only accepts a lab inventory; this document was detected as '{kind}'."
  fix: "Use vcf_validate_spec to check an already-rendered SddcSpec document; render() only works on a LabInventory."
VCF-RENDER-UNDECLARED-FIELD:
  severity: error
  source: schema
  source_url: https://github.com/vmware/vcf-api-specs
  summary: "The rendered spec has a field at {pointer} that the VCF Installer schema does not declare."
  fix: "This is a renderer bug, not an input problem: no $def in the vendored schema sets additionalProperties:false, so jsonschema alone cannot catch an invented key. Report it with the inventory that produced it."
VCF-RENDER-DEFAULT-APPLIED:
  severity: info
  source: table
  source_url: ""
  summary: "A default was applied."
  fix: "Set the value explicitly in the inventory to override."
VCF-RENDER-FAILED:
  severity: critical
  source: schema
  source_url: ""
  summary: "render() raised {exc_type} while building the spec."
  fix: "Run validate_document on the same input; its structured findings explain what is wrong. render() itself never describes the failure, so it cannot echo spec content."
VCF-RENDER-INSECURE-CREDENTIAL:
  severity: critical
  source: schema
  source_url: ""
  summary: "render() refused to emit a credential that is not a ${reference}."
  fix: "Use ${name} references for every credential, never a literal value. Run validate_document on the same input to see which credential field is affected."
VCF-DIFF-TRUNCATED:
  severity: error
  source: schema
  source_url: ""
  # Blocking on purpose. A partial diff that reported valid: true would be
  # read as a complete one -- an agent asking "did anything under
  # /credentials change?" would get a clean-looking answer from a walk
  # that stopped early. The diff that IS returned is still correct as far
  # as it goes, so it is returned rather than withheld; it just may not be
  # all of it, and the caller is told so twice (this finding and a
  # `truncated` key).
  summary: "The diff was truncated at {changes} changes / {chars} characters: this comparison is INCOMPLETE and must not be read as 'nothing else changed'."
  fix: "Diff a smaller pair of documents, or narrower sections of them. A document using YAML aliases can expand to far more changes than its source text suggests."
VCF-EXPLAIN-UNKNOWN-CODE:
  severity: error
  source: schema
  source_url: ""
  summary: "No rule with that code."
  fix: "Call vcf_validate_spec to get real codes."
INTERNAL:
  severity: critical
  source: schema
  source_url: ""
  summary: "The tool failed internally ({detail})."
  fix: "Report this with the input that caused it."
VCF-MCP-BAD-ARGS:
  severity: error
  source: schema
  source_url: ""
  summary: "The tool '{tool}' was called with invalid arguments ({detail})."
  fix: "Check the tool's input schema (required fields, types, and that no unknown properties are set) and retry with corrected arguments."
VCF-NET-GATEWAY-OUTSIDE-SUBNET:
  severity: error
  source: docs
  source_url: https://techdocs.broadcom.com/us/en/vmware-cis/vcf/vcf-9-0-and-later/9-1/design/design-library/vsphere-detailed-design/esx-design.html
  summary: "Gateway {gateway} is not inside subnet {subnet} for network '{purpose}'."
  fix: "Set a gateway address within the declared subnet."
VCF-NET-SUBNET-OVERLAP:
  severity: error
  source: docs
  source_url: https://techdocs.broadcom.com/us/en/vmware-cis/vcf/vcf-9-0-and-later/9-1/design/design-library/vsphere-detailed-design/esx-design.html
  summary: "'{purpose}' ({subnet}) overlaps '{other}' ({other_subnet})."
  fix: "Give each traffic type a distinct subnet."
VCF-NET-VLAN-REUSED:
  severity: error
  source: docs
  source_url: https://techdocs.broadcom.com/us/en/vmware-cis/vcf/vcf-9-0-and-later/9-1/design/design-library/vsphere-detailed-design/esx-design.html
  summary: "VLAN {vlan} is used by both '{purpose}' and '{other}'."
  fix: "Separate each traffic type onto its own VLAN."
VCF-NSX-FABRIC-MTU-TOO-LOW:
  severity: error
  source: docs
  source_url: https://techdocs.broadcom.com/us/en/vmware-cis/vcf/vcf-9-0-and-later/9-1/design/design-library/vsphere-detailed-design/esx-design.html
  summary: "NSX fabric MTU is {mtu}; overlay traffic needs at least 1600."
  fix: "Set fabricMtu to 1600 or more (9000 where the switches allow it)."
VCF-NET-HOST-IP-OUTSIDE-SUBNET:
  severity: error
  source: docs
  source_url: https://techdocs.broadcom.com/us/en/vmware-cis/vcf/vcf-9-0-and-later/9-1/building-your-private-cloud-infrastructure/host-management/commission-hosts.html
  summary: "Host {name} management IP {ip} is outside {subnet}."
  fix: "Give the host an address inside the management subnet."
VCF-NET-DUPLICATE-IP:
  severity: error
  source: docs
  source_url: https://techdocs.broadcom.com/us/en/vmware-cis/vcf/vcf-9-0-and-later/9-1/building-your-private-cloud-infrastructure/host-management/commission-hosts.html
  summary: "IP {ip} is used more than once ({where})."
  fix: "Give every host a unique address."
VCF-NET-IP-POOL-MISSING:
  severity: error
  source: docs
  source_url: ""
  # Verbatim from a real VCF 9.1.1 Installer POST /v1/sddcs/validations
  # response: MISSING_INCLUSION_RANGE failed the Deployment Specification
  # check for both VMOTION and VSAN, and every downstream check (DNS
  # Resolution, Network Configuration, Capacity Calculation) was skipped
  # because this one failed first.
  summary: "Network '{purpose}' has no IP pool. The VCF Installer's Deployment Specification check fails this with MISSING_INCLUSION_RANGE: 'Inclusion Range not provided for network {purpose_upper}'."
  fix: "Provide Inclusion Range for network {purpose_upper} in the input specification: add pool.start and pool.end under networks.{purpose}, sized for at least one address per host."
VCF-NET-IP-POOL-TOO-SMALL:
  severity: error
  source: docs
  source_url: ""
  # Verbatim remediation from the same Installer response: "Insufficient IP
  # Addresses provided for the IP Pool that supports the {NETWORK} network.
  # Provided {n}, Required {m}." and "(IP Addresses ending with 0 and 255
  # are ignored)". Each host needs one vmk on vmotion and one on vsan.
  summary: "Insufficient IP Addresses provided for the IP Pool that supports the {purpose_upper} network. Provided {size}, Required {hosts}."
  fix: "Widen networks.{purpose}.pool to cover at least {hosts} usable addresses. The Installer ignores addresses ending in .0 and .255, so a pool only reaching {hosts} by counting those is still too small."
VCF-NSX-TEP-POOL-TOO-SMALL:
  severity: warning
  source: docs
  source_url: https://techdocs.broadcom.com/us/en/vmware-cis/vcf/vcf-9-0-and-later/9-1/design/design-library/vsphere-detailed-design/esx-design.html
  summary: "TEP pool holds {size} addresses; {hosts} hosts typically need {needed}."
  fix: "Widen the TEP pool: two tunnel endpoints per host is the usual figure."
VCF-NAME-NOT-LOWERCASE:
  severity: error
  source: docs
  source_url: https://techdocs.broadcom.com/us/en/vmware-cis/vcf/vcf-9-0-and-later/9-1/release-notes/vmware-cloud-foundation-9-1-0-0-release-notes/known-issues/vcf-installer-91-known-issues.html
  summary: "'{value}' at {where} is not lowercase."
  fix: "Use lowercase names everywhere; uppercase fails VCF 9.1 deployment."
VCF-NAME-WRONG-DOMAIN:
  severity: warning
  source: docs
  source_url: https://techdocs.broadcom.com/us/en/vmware-cis/vcf/vcf-9-0-and-later/9-1/deployment/deploying-a-new-vmware-cloud-foundation-or-vmware-vsphere-foundation-private-cloud-/preparing-your-environment.html
  summary: "'{value}' is not in the declared DNS subdomain '{domain}'."
  fix: "Use names inside the declared subdomain, or correct dns.subdomain."
VCF-VSP-POOL-TOO-SMALL:
  severity: error
  source: docs
  source_url: https://techdocs.broadcom.com/us/en/vmware-cis/vcf/vcf-9-0-and-later/9-1/deployment/upgrading-cloud-foundation/deploy-vcf-management-services.html
  summary: "VCF Management Services pool holds {size} addresses; the minimum is 12."
  fix: "Reserve at least 12 consecutive addresses (30 recommended)."
VCF-VSP-POOL-CROSSES-SUBNET:
  severity: error
  source: docs
  source_url: https://techdocs.broadcom.com/us/en/vmware-cis/vcf/vcf-9-0-and-later/9-1/deployment/upgrading-cloud-foundation/deploy-vcf-management-services.html
  summary: "VCFMS pool {start}-{end} is not inside one subnet."
  fix: "Keep the pool inside the management subnet."
VCF-VSP-INTERNAL-CIDR-COLLISION:
  severity: error
  source: docs
  source_url: https://techdocs.broadcom.com/us/en/vmware-cis/vcf/vcf-9-0-and-later/9-1/deployment/upgrading-cloud-foundation/deploy-vcf-management-services.html
  summary: "VCFMS internal CIDR {cidr} overlaps '{purpose}' ({subnet})."
  fix: "Choose another permitted internal CIDR."
VCF-CAP-RAM-SHORTFALL:
  severity: error
  source: table
  source_url: ""
  summary: "Mandatory stack needs {needed} GB RAM; the cluster offers {available} GB."
  fix: "Add RAM, hosts, or memory tiering."
VCF-CAP-N1-SHORTFALL:
  severity: warning
  source: table
  source_url: ""
  summary: "Losing one host leaves {available} GB against {needed} GB needed."
  fix: "Enable memory tiering, or accept that maintenance cannot host the full stack."
VCF-CAP-STORAGE-SHORTFALL:
  severity: error
  source: table
  source_url: ""
  summary: "Stack needs {needed} GB usable; vSAN offers about {available} GB."
  fix: "Add capacity: Auto-RAID overhead is 1.5x at three to five hosts."
VCF-CAP-UNKNOWN-HARDWARE:
  severity: error
  source: table
  source_url: ""
  summary: "Host {name} declares no usable hardware, so capacity cannot be checked."
  fix: "Add hardware.ramGb for every host. hardware.cores is required by the inventory schema but is not part of capacity sizing here -- vCPU is routinely oversubscribed in a vSphere cluster, unlike RAM, so it is not checked against the mandatory stack's vCPU demand."
VCF-LIC-EVALUATION:
  severity: info
  source: docs
  source_url: https://techdocs.broadcom.com/us/en/vmware-cis/vcf/vcf-9-0-and-later/9-1/licensing/licensing-overview/licensing-model.html
  summary: "VCF 9.x has no license keys; this deploys in 90-day evaluation."
  fix: "Assign a subscription licence in VCF Operations after deployment."
VCF-PROBE-NO-REVERSE-DNS:
  severity: error
  source: docs
  source_url: https://techdocs.broadcom.com/us/en/vmware-cis/vcf/vcf-9-0-and-later/9-1/deployment/deploying-a-new-vmware-cloud-foundation-or-vmware-vsphere-foundation-private-cloud-/preparing-your-environment.html
  summary: "No reverse DNS record for {ip} ({fqdn})."
  fix: "Add a PTR record; VCF validates forward and reverse for every host."
VCF-PROBE-REVERSE-MISMATCH:
  severity: error
  source: docs
  source_url: https://techdocs.broadcom.com/us/en/vmware-cis/vcf/vcf-9-0-and-later/9-1/deployment/deploying-a-new-vmware-cloud-foundation-or-vmware-vsphere-foundation-private-cloud-/preparing-your-environment.html
  summary: "Reverse DNS for {ip} says {resolved}, but the inventory calls it {fqdn}."
  fix: "Correct the PTR record so it matches the host's FQDN. A PTR that resolves to a different name is worse than a missing one: VCF validates both directions and fails obscurely on the mismatch."
VCF-PROBE-FORWARD-MISMATCH:
  severity: error
  source: docs
  source_url: https://techdocs.broadcom.com/us/en/vmware-cis/vcf/vcf-9-0-and-later/9-1/deployment/deploying-a-new-vmware-cloud-foundation-or-vmware-vsphere-foundation-private-cloud-/preparing-your-environment.html
  summary: "{fqdn} resolves to {resolved}, but the inventory says {expected}."
  fix: "Correct the A record or the inventory so they agree."
VCF-PROBE-TARGET-BLOCKED:
  severity: warning
  source: docs
  source_url: ""
  summary: "Refused to probe {target}: outside the configured allowlist."
  fix: "Add the range to the probe allowlist if it really is yours."
VCF-PROBE-NAME-BLOCKED:
  severity: warning
  source: docs
  source_url: ""
  summary: "Refused to resolve {name}: outside the configured DNS name allowlist."
  fix: "Pass --allowlist-domain with the DNS suffix your lab really uses; every host and appliance name under it is then resolved. With none configured no forward lookup is issued at all, so expect one of these per name in the document: an IP allowlist cannot gate a name, because the query that would reveal the IP is itself the exfiltration channel. The appliance names (vCenter, SDDC Manager, the NSX managers and VIP, the VSP names) have no declared address for an IP allowlist to gate them by at all, so this suffix is the only containment they have."
VCF-PROBE-NOTHING-PERMITTED:
  severity: error
  source: docs
  source_url: ""
  summary: "Probes were requested, but the allowlist permitted none of the {count} host(s) in this document, so no host was checked."
  fix: "Correct --allowlist so it covers the management network these hosts are on, or drop --probe. A non-empty allowlist that matches no host checks exactly as much as no allowlist at all."
VCF-PROBE-SEAM-UNUSABLE:
  severity: error
  source: docs
  source_url: ""
  summary: "Probes were requested, but the injected {seam} is unusable ({reason}), so nothing was probed."
  fix: "Pass a callable taking three positional arguments: resolve(name, want_reverse, want_canonical) or connect(host, port, timeout). The resolver's third argument asks for a combined forward answer -- (canonical name, primary address) from a single lookup -- which the appliance round-trip check requires. This is reported rather than tolerated because the alternative is silent: an unusable resolver's TypeError is caught alongside every other resolver failure, so every name would be reported as unresolvable while the run still passed. Only a caller injecting its own resolver or connector can see this; the CLI and the MCP server never do."
VCF-PROBE-UNKNOWN:
  severity: info
  source: docs
  source_url: ""
  summary: "Could not probe {target}: {reason}."
  fix: "Re-run from a host on the management network to confirm."
VCF-PROBE-RESOLVER-MISMATCH:
  severity: info
  source: docs
  source_url: ""
  summary: "Probe answers came from {runner}, which is none of the declared nameservers ({declared})."
  fix: "This is not necessarily wrong -- a forwarder can resolve the lab zone correctly, systemd-resolved reports only 127.0.0.53, and Windows has no resolv.conf at all. It tells you the answers above were not obtained from the DNS the deployment will use. Re-run from the management network to be certain."
VCF-PROV-NO-BOOT-SERVER:
  severity: error
  source: docs
  source_url: https://techdocs.broadcom.com/us/en/vmware-cis/vsphere/vsphere/9-0/esxi-installation-and-setup.html
  summary: "No provisioning.bootServerUrl, so a booting host has nowhere to fetch its kickstart."
  fix: "Add provisioning.bootServerUrl pointing at the HTTP server that serves the boot artifacts."
VCF-PROV-NO-MGMT-NETWORK:
  severity: error
  source: docs
  source_url: https://techdocs.broadcom.com/us/en/vmware-cis/vsphere/vsphere/9-0/esxi-installation-and-setup.html
  summary: "networks.management needs a usable subnet and gateway before a kickstart can set static addressing."
  fix: "Give networks.management a CIDR subnet and a gateway."
VCF-PROV-NO-MAC:
  severity: error
  source: docs
  source_url: https://techdocs.broadcom.com/us/en/vmware-cis/vsphere/vsphere/9-0/esxi-installation-and-setup.html
  summary: "Host {host} has no provisioningMac, so it cannot be given a per-MAC boot config."
  fix: "Record the MAC of the NIC that UEFI HTTP boots. It is how a booting host finds its own kickstart."
VCF-PROV-NO-BOOT-DISK:
  severity: error
  source: docs
  source_url: https://techdocs.broadcom.com/us/en/vmware-cis/vsphere/vsphere/9-0/esxi-installation-and-setup.html
  summary: "Host {host} has no bootDisk, so the install target is undefined."
  fix: "Name the install device explicitly. Relying on first-disk ordering risks installing over the vSAN device."
VCF-PROV-NO-ESX-BOOT-CFG:
  severity: error
  source: docs
  source_url: https://techdocs.broadcom.com/us/en/vmware-cis/vsphere/vsphere/9-0/esxi-installation-and-setup.html
  summary: "No ESX boot.cfg was supplied, so no UEFI boot configs were generated."
  fix: "Copy the ESX ISO contents to the boot server, then pass that directory's own boot.cfg content as esx_boot_cfg. It carries the modules=, build= and updated= lines that only the ISO knows; a synthesised boot.cfg cannot boot."
VCF-PROV-NO-ROOT-HASH:
  severity: error
  source: docs
  source_url: https://techdocs.broadcom.com/us/en/vmware-cis/vsphere/vsphere/9-0/esxi-installation-and-setup.html
  summary: "No credentials.esxRootHash, so the kickstart has no root password to set."
  fix: "Add credentials.esxRootHash as a ${reference} (e.g. ${esx_root_hash}) resolving to a SHA-512 crypt hash. Generate one with: openssl passwd -6. The kickstart is published over unauthenticated HTTP, so it must carry a hash and never a password."
VCF-PROV-BOOT-DISK-FIRSTDISK:
  severity: error
  source: docs
  source_url: https://techdocs.broadcom.com/us/en/vmware-cis/vsphere/vsphere/9-0/esxi-installation-and-setup.html
  summary: "Host {host} selects its boot disk with '{selector}'. --firstdisk orders by driver and PCI enumeration, not by size or role, so it can select the vSAN ESA device and repartition it."
  fix: "Name a stable device identifier instead: /vmfs/devices/disks/t10...., eui.... or naa..... Read them from a live host with: esxcli storage core device list."
VCF-PROV-BOOT-DISK-RUNTIME-NAME:
  severity: error
  source: docs
  source_url: https://techdocs.broadcom.com/us/en/vmware-cis/vsphere/vsphere/9-0/esxi-installation-and-setup.html
  summary: "Host {host} selects its boot disk by the runtime name '{selector}'. mpx and vmhbaN:C0:T0:L0 names are assigned at boot in discovery order and are not stable across reboots or hardware changes."
  fix: "Name a stable device identifier instead: /vmfs/devices/disks/t10...., eui.... or naa..... Read them from a live host with: esxcli storage core device list."
VCF-CAP-TIERING-NEEDS-WORKAROUND:
  severity: error
  source: docs
  source_url: https://williamlam.com/2026/05/vcf-9-1-comprehensive-esx-configuration-workarounds-for-lab-deployments.html
  summary: "Host {host} declares hardware.memoryTieringGb {tier}, but 'consumer-amd' is not in provisioning.hostWorkarounds. NVMe memory tiering cannot power on VMs on AMD Ryzen without the monitor_control.disable_apichv workaround, so the capacity plan's tiered RAM is not actually available."
  fix: "Add 'consumer-amd' to provisioning.hostWorkarounds so %firstboot sets monitor_control.disable_apichv=\"TRUE\" in /etc/vmware/config -- or set memoryTieringGb to 0 if this host is not consumer AMD hardware."
VCF-PROV-BOOT-DISK-NOT-STABLE:
  severity: error
  source: docs
  source_url: https://techdocs.broadcom.com/us/en/vmware-cis/vsphere/vsphere/9-0/esxi-installation-and-setup.html
  summary: "Host {host} names its boot disk as '{selector}', which is not a stable device identifier."
  fix: "Use /vmfs/devices/disks/t10...., eui.... or naa..... Read them from a live host with: esxcli storage core device list. With no BMC, an install that picks the wrong device destroys the vSAN member and costs a physical visit."
VCF-PROV-NO-TIERING-DEVICE:
  severity: error
  source: docs
  source_url: https://techdocs.broadcom.com/us/en/vmware-cis/vsphere/vsphere/9-1/vsphere-resource-management/memory-tiering-over-nvme/memory-tiering-configuration.html
  summary: "Host {host} declares hardware.memoryTieringGb {tier}, but no hardware.memoryTieringDevice, so %firstboot has no device to enable tiering on and the host will boot with DRAM only."
  fix: "Add hardware.memoryTieringDevice naming the NVMe device reserved for tiering, as a stable identifier (/vmfs/devices/disks/t10...., eui.... or naa....). Read them from a live host with: esxcli memtier device list. Until it is there, every capacity figure that counted tiered memory is counting RAM the host will not have."
VCF-PROV-TIERING-DEVICE-NOT-STABLE:
  severity: error
  source: docs
  source_url: https://techdocs.broadcom.com/us/en/vmware-cis/vsphere/vsphere/9-1/vsphere-resource-management/memory-tiering-over-nvme/memory-tiering-configuration.html
  summary: "Host {host} names its memory tiering device as '{selector}', which is not a stable device identifier, so no tiering was configured."
  fix: "Use /vmfs/devices/disks/t10...., eui.... or naa..... mpx and vmhbaN:C0:T0:L0 names are assigned at boot in discovery order, so the device one reaches today is not the device it reaches after a reboot -- and `esxcli memtier enable` consumes whatever it is given."
VCF-PROV-TIERING-RATIO-UNSUPPORTED:
  severity: error
  source: docs
  source_url: https://techdocs.broadcom.com/us/en/vmware-cis/vsphere/vsphere/9-1/vsphere-resource-management/memory-tiering-over-nvme/memory-tiering-configuration.html
  summary: "Host {host} would need a memory tier ratio of {ratio}% ({tier} GB tier against {ram} GB DRAM), and ESX accepts 1-400%. No tiering was configured."
  fix: "Bring hardware.memoryTieringGb and hardware.ramGb into a ratio ESX supports: the tier can be at most four times DRAM. A ratio of 0 usually means hardware.ramGb is missing or zero."
VCF-PROV-DEVICE-COLLISION:
  severity: error
  source: docs
  source_url: https://techdocs.broadcom.com/us/en/vmware-cis/vsphere/vsphere/9-1/vsphere-resource-management/memory-tiering-over-nvme/memory-tiering-configuration.html
  summary: "Host {host} names the same device '{device}' as both {first} and {second}. The three roles consume the device they are given, so no artifacts were generated for this host."
  fix: "Give each role its own device. bootDisk is installed over, vsanDevice is claimed by vSAN ESA, and memoryTieringDevice is consumed whole by `esxcli memtier enable` -- any two of them on one NVMe destroys the other's data, and with no BMC that is a drive to the rack. Read the real identifiers from a live host with: esxcli storage core device list."
VCF-PROV-SSH-KEY-NOT-PUBLIC:
  severity: error
  source: docs
  source_url: https://techdocs.broadcom.com/us/en/vmware-cis/vsphere/vsphere/9-0/esxi-installation-and-setup.html
  summary: "provisioning.sshPublicKey is not a recognised OpenSSH public key."
  fix: "Give the one-line contents of a .pub file (ssh-ed25519/ssh-rsa/ecdsa-sha2-nistp* followed by the base64 blob). Not a private key, not a path, and not a ${reference}: this value is written verbatim into a kickstart published over unauthenticated HTTP, so it is refused unless it is visibly a public key."
VCF-NAME-VSP-LOCAL-SUFFIX:
  severity: warning
  source: docs
  source_url: https://blogs.vmware.com/cloud-foundation/2026/04/17/bridging-the-local-gap-a-split-domain-design-for-vmware-cloud-foundation-deployment/
  summary: "'{value}' at {where} uses the .local suffix, which the VCF Management Services platform does not support."
  fix: "Use a routable suffix for the VSP names. This is a warning, not an error: VCF Operations, vCenter, NSX and SDDC Manager still allow .local during the transition window -- only VCF Identity Broker, VCF Automation and vSphere Supervisor dropped it, and those three run on the VSP platform. Correcting dns.subdomain fixes the composed names in one edit."
