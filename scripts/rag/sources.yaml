# RAG corpus sources for AnythingLLM workspaces.
#
# Single source of truth for what gets ingested. Edit this file to add,
# disable, or reconfigure a source, then run:
#
#   scripts/rag/refresh.py --source <id> --dry-run    # preview
#   scripts/rag/refresh.py --source <id>              # apply
#   scripts/rag/refresh.py                            # honor refresh_interval
#   scripts/rag/refresh.py --force                    # all sources regardless of interval
#
# Sources are keyed by `id`. Each must declare a `handler` matching one of
# scripts/rag/handlers/<name>.py. Disabled sources are skipped entirely.
#
# Refresh intervals use suffixes: 30d, 12h, 90m. The orchestrator skips a
# source unless `(now - last_success) >= refresh_interval` or --force is set.
#
# ── handler reference ──────────────────────────────────────────────────────
#   github_repo      Clone a git repo, walk files matching file_glob, compute
#                    a citation URL per file, ingest as raw text. Best for
#                    sources where the vendor publishes docs as text in git.
#
#   sphinx_sitemap   Fetch sitemap.xml (with fallback to scraping per-section
#                    index pages), filter URLs, trafilatura-extract each one,
#                    ingest as raw text. Best for hosted Sphinx sites.
#
#   hugo_sitemap     STUB (Phase 2). Like sphinx_sitemap but tuned for Hugo's
#                    sitemap shape + Last-Modified header use.
#
#   rss              STUB (Phase 2). Periodically poll an RSS feed for new
#                    entries, trafilatura-extract each post URL.
#
#   url_list_hashed  STUB (Phase 2). Hand-curated URL list; refresh checks
#                    content hash of each URL and re-ingests on change.

sources:

  # ── Official: TrueNAS middleware API reference ──────────────────────────
  # The Sphinx-rendered API methods/objects/events index served by iXsystems.
  # Used to verify midclt call signatures and response shapes.
  # NOTE: doc_prefix matches what the original recover-long-urls.sh ingest
  # used. If you want to track multiple API versions side-by-side later,
  # change this to include the version (e.g. " v27.0") AFTER the existing
  # docs are migrated — otherwise the prefix-match fallback in
  # migrate_backfill.py handles the drift.
  - id: truenas-api-v27
    handler: sphinx_sitemap
    enabled: true
    workspace: sdg-documentation
    doc_prefix: "[OFFICIAL] api.truenas.com"
    refresh_interval: 30d
    config:
      sitemap_url: https://api.truenas.com/v27.0/sitemap.xml
      base_url: https://api.truenas.com/v27.0
      fallback_index_pages:
        - api_methods.html
        - api_objects.html
        - api_events.html
      include_patterns:
        - "api_methods_"
        - "api_objects_"
        - "api_events_"
        - "examples"
        - "using_"
        - "/index.html$"
      exclude_patterns: []

  # ── Official: OPNsense user documentation ───────────────────────────────
  - id: opnsense-docs
    handler: github_repo
    enabled: true
    workspace: sdg-documentation
    doc_prefix: "[OFFICIAL] opnsense/docs"
    refresh_interval: 7d
    config:
      repo: https://github.com/opnsense/docs
      file_glob: "*.rst"
      path_strip: "source/"
      rendered_base: https://docs.opnsense.org
      url_ext_from: ".rst"
      url_ext_to: ".html"

  # ── Official: Keycloak documentation ────────────────────────────────────
  # Many topic .adoc files compile to a single HTML guide page,
  # so url_keep_depth=1 collapses them to the guide URL.
  #
  # file_exclude_regex carries the section-level "topics/" partials too:
  # Keycloak's structure is docs/documentation/<section>/topics/*.adoc
  # (e.g. docs/documentation/server_admin/topics/login.adoc) which
  # asciidoc includes into the main guide; ingesting them separately just
  # duplicates content into the same collapsed URL.
  - id: keycloak-docs
    handler: github_repo
    enabled: true
    workspace: sdg-documentation
    doc_prefix: "[OFFICIAL] keycloak/docs"
    refresh_interval: 7d
    config:
      repo: https://github.com/keycloak/keycloak
      file_glob: "*.adoc"
      path_strip: "docs/documentation/"
      rendered_base: https://www.keycloak.org/docs/latest
      url_ext_from: ".adoc"
      url_ext_to: "/"
      url_keep_depth: 1
      file_exclude_regex: '^docs/(guides|maven-plugin|documentation/(dist|header-maven-plugin|internal_resources|tests|aggregation|(?:[^/]+/)?topics))/'

  # ── Official: TrueNAS Scale user docs (Hugo) ────────────────────────────
  # NOTE: verify repo path against your actual ingest history; some operators
  # use a private mirror. The Hugo build lowercases paths.
  - id: truenas-scale-docs
    handler: github_repo
    enabled: true
    workspace: sdg-documentation
    doc_prefix: "[OFFICIAL] truenas/documentation"
    refresh_interval: 7d
    config:
      repo: https://github.com/truenas/documentation
      file_glob: "*.md"
      path_strip: "content/"
      rendered_base: https://www.truenas.com/docs
      url_ext_from: ".md"
      url_ext_to: "/"
      url_lowercase: true

  # ── Official: TrueNAS blog (parked — no public feed exists) ─────────────
  # Originally split out of truenas-scale-docs via
  # scripts/rag/split_truenas_blog.py (migrate_backfill prefix-matched
  # /blog/ URLs into the docs source by mistake). 595 historical entries
  # remain in /tank/rag-state/truenas-blog/documents.json with hash=
  # "migrated", still searchable through the sdg-documentation workspace.
  #
  # 2026-05-25 verification: TrueNAS / iXsystems publish no public RSS,
  # Atom, or accessible sitemap for blog content. Probed:
  #     /blog/feed/                404
  #     /blog/index.xml            404
  #     /feed, /rss, /atom.xml etc 301 → SPA fallback (no real feed)
  #     /sitemap.xml               301 → SPA fallback
  #     /robots.txt                lists 3 sitemaps (main / community /
  #                                docs), main one redirects same as above;
  #                                community is the forum; docs is already
  #                                ingested via truenas-scale-docs handler.
  # The rss handler itself (scripts/rag/handlers/rss.py) and the
  # removal_policy=additive_only support in plan.py/refresh.py are shipped
  # and usable for any future source that DOES have a feed — likely
  # candidates: homenetworkguy.com, klarasystems.com, ServeTheHome, Phase
  # Two, etc. Just add a new entry below with handler: rss + the same
  # removal_policy: additive_only field.
  #
  # For *new* TrueNAS blog content, the cluster's server-side tool
  # execution route (see day-2-ops.md § 6.8) supports live web search via
  # tavily_search — bypassing the need for RAG-indexed up-to-the-minute
  # blog content. RAG retains the historical corpus; Tavily handles fresh.
  - id: truenas-blog
    handler: rss
    enabled: false   # no working feed found — see comment above
    removal_policy: additive_only
    workspace: sdg-documentation
    doc_prefix: "[OFFICIAL] truenas/blog"
    refresh_interval: 7d
    config:
      rss_url: https://www.truenas.com/blog/feed/   # 404 as of 2026-05-25
      url_domain_filter: '^https?://www\.truenas\.com/blog/'
      max_entries: 50

  # ── Official: OpenZFS documentation ─────────────────────────────────────
  # Some directories contain spaces (e.g., "Basic Concepts/") which must be
  # URL-encoded in the citation URL.
  #
  # State-recovery procedure (one-time, run on PVE host) if documents.json
  # holds stale '/en/' URLs from a pre-refresh.py ingest pattern:
  #   rm /tank/rag-state/openzfs-docs/{documents,manifest}.json
  #   /opt/vcf-scraper-venv/bin/python scripts/rag/refresh.py \
  #     --source openzfs-docs --force
  #   /opt/vcf-scraper-venv/bin/python scripts/rag/cleanup_interrupted_refresh.py \
  #     --source openzfs-docs --apply
  # The cleanup helper treats the workspace's leftover /en/ docs as orphans
  # because the fresh state doesn't track them — same mechanism as the
  # interrupted-refresh recovery, repurposed for URL-shape migration.
  - id: openzfs-docs
    handler: github_repo
    enabled: true
    workspace: sdg-documentation
    doc_prefix: "[OFFICIAL] openzfs/openzfs-docs"
    refresh_interval: 14d
    config:
      repo: https://github.com/openzfs/openzfs-docs
      file_glob: "*.rst"
      path_strip: "docs/"
      rendered_base: https://openzfs.github.io/openzfs-docs
      url_ext_from: ".rst"
      url_ext_to: ".html"
      url_encode_spaces: true

  # ── Official: VMware Cloud Foundation 9.x release notes ─────────────────
  # SCOPE IS DELIBERATELY NARROW. The us/en VCF 9.x corpus is ~13,500 URLs;
  # at the 10s crawl-delay Broadcom's robots.txt mandates, a full pass would
  # take ~37 hours. This source covers only the release-notes subtree
  # (191 URLs, ~31 min/pass) — release notes, patch releases, BOM, product
  # support notes, changelogs. That is the high-churn, currency-critical part:
  # patch releases ship continuously between major versions, and a stale
  # answer there is the one most likely to mislead.
  #
  # The remaining ~10,800 topical docs (infrastructure-operations, design,
  # advanced-network-management, ...) are the one-time 2026-05-18/19 bulk
  # ingest and stay manual. Re-run scripts/tools/recover-long-urls.sh against
  # a filtered URL list to top those up.
  #
  # HANDLER CHOICE IS LOAD-BEARING. sphinx_sitemap uses trafilatura, which
  # strips nav chrome. Do NOT switch this to an upload-link based path:
  # verified 2026-08-22, Broadcom now renders the entire VCF nav tree into
  # server-side HTML, so AnythingLLM's built-in scraper yields ~992 KB /
  # ~122k-token documents that are ~97% navigation. Pages then hash as
  # near-identical and get content-deduped — a 59-doc ingest silently
  # collapsed to 22 and dropped every NSX page. See the banner in
  # scripts/tools/ingest-urls.sh.
  #
  # NOTE: Broadcom stamps <lastmod> on essentially every URL at each site
  # rebuild (13,484 of 13,494 read as 2026-08), so lastmod is useless as a
  # change signal here. refresh.py's content-hash comparison is what actually
  # detects real changes.
  - id: vcf-release-notes
    handler: sphinx_sitemap
    enabled: true
    workspace: vcf-reference
    doc_prefix: "[OFFICIAL] VMware Cloud Foundation 9.x release notes"
    refresh_interval: 7d
    crawl_delay_seconds: 10       # techdocs.broadcom.com robots.txt: Crawl-delay: 10
    request_timeout_seconds: 60   # sitemap shards are ~12 MB each
    config:
      # This is a <sitemapindex> of 17 shards; the handler follows it one
      # level down to the <urlset>s.
      sitemap_url: https://techdocs.broadcom.com/techdocs2-sitemap.xml
      base_url: https://techdocs.broadcom.com
      include_patterns:
        # us/en only — the same tree also ships fr/fr, es/es and jp/ja, which
        # would pollute an English-only corpus (180 of 239 patch URLs were
        # localizations).
        - '^https://techdocs\.broadcom\.com/us/en/vmware-cis/vcf/vcf-9-0-and-later/[^/]+/release-notes'

  # ── Official: VCF core operational docs (coverage backfill) ─────────────
  # The other half of the vcf-reference corpus. Upstream has ~13,500 us/en
  # VCF 9.x URLs; only ~5,000 were ever ingested (the 2026-05 bulk run stopped
  # partway), so this is a COVERAGE gap, not just a currency one.
  #
  # Scope: the two largest operational subtrees, ~4,425 URLs.
  #   infrastructure-operations      3,215
  #   advanced-network-management    1,210
  # Deliberately excludes administration-sdks-cli-and-tools (3,010) -- that is
  # auto-generated API/CLI reference whose near-identical pages dilute
  # retrieval; ingest it as its own source if it turns out to be wanted.
  #
  # max_urls_per_run keeps any single run bounded so an unattended backfill
  # cannot run away; the source resumes where it left off because the handler
  # prioritises never-fetched URLs first, then oldest last_fetched. Expect
  # several runs to reach full coverage.
  #
  # parallel_workers=4 at crawl_delay 10 is ~2.5s effective between requests.
  # That is a looser reading of Broadcom's "Crawl-delay: 10" than strict
  # serial, chosen deliberately: the 2026-05 ingest ran at exactly this ratio
  # for ~30 hours without Cloudflare throttling. Drop to 1 to be strict.
  - id: vcf-core-docs
    handler: sphinx_sitemap
    enabled: true
    workspace: vcf-reference
    doc_prefix: "[OFFICIAL] VMware Cloud Foundation 9.x operations"
    # Steady-state cadence. These docs are operational reference, not release
    # notes -- they change slowly, and content-hash comparison means an
    # unchanged page costs a fetch but no re-embed.
    #
    # NOTE ON BACKFILL: 30d governs the nightly TIMER only. While the initial
    # coverage backfill is still running, drive it with
    #   refresh.py --source vcf-core-docs --force
    # which bypasses the interval. The backfill is done when
    # /tank/rag-state/vcf-core-docs/manifest.json shows ~4425 documents and
    # documents.json has no "migrated" placeholder hashes left.
    refresh_interval: 30d
    crawl_delay_seconds: 10
    request_timeout_seconds: 60
    config:
      sitemap_url: https://techdocs.broadcom.com/techdocs2-sitemap.xml
      base_url: https://techdocs.broadcom.com
      parallel_workers: 4
      max_urls_per_run: 900
      include_patterns:
        - '^https://techdocs\.broadcom\.com/us/en/vmware-cis/vcf/vcf-9-0-and-later/[^/]+/(infrastructure-operations|advanced-network-management)'

  # ── Official: VCF remaining operational docs (coverage completion) ──────
  # Everything in the us/en VCF 9.x tree that the other two sources do not
  # already own: 5,868 URLs across 24 subtrees -- organization-management 872,
  # design 785, vsan 750, fleet-management 749, orchestrator 494,
  # vsphere-supervisor 394, workload-mobility 355, and the long tail.
  #
  # EXCLUDES administration-sdks-cli-and-tools (3,010 URLs, 34% of the
  # remaining work). That tree is auto-generated API/CLI reference: the pages
  # are near-identical in structure, so they match many queries weakly and
  # crowd out prose that actually answers the question. Add it as its OWN
  # source if API lookup from RAG turns out to be wanted, so it can be dropped
  # independently if it hurts retrieval.
  #
  # The exclude list must stay in sync with the include_patterns of
  # vcf-release-notes and vcf-core-docs; overlapping sources would fight over
  # the same documents. Verified 2026-08-24: 0 overlap.
  #
  # 30d is the steady-state cadence. The initial coverage backfill (~5,868
  # fetches, ~4.9 h at 4 workers) is driven with
  #   refresh.py --source vcf-remaining-docs --force
  # which bypasses the interval. Done when documents.json has no "migrated"
  # placeholder hashes and tracked is ~5,868.
  - id: vcf-remaining-docs
    handler: sphinx_sitemap
    enabled: true
    workspace: vcf-reference
    doc_prefix: "[OFFICIAL] VMware Cloud Foundation 9.x reference"
    refresh_interval: 30d
    # TEMPORARY, FOR THE BACKFILL ONLY. Restore to the 10% default once
    # documents.json has no "migrated" placeholders left.
    #
    # This source's state was ADOPTED from the 2026-05 bulk ingest, and
    # Broadcom restructured in the interim: old GUID-style and flat URLs were
    # replaced by the current hierarchy, so ~438 of the 2,796 inherited URLs
    # (15.7%) now 404. The 10% guard halted every tranche on that same stale
    # set, which meant zero progress overnight.
    #
    # Verified before relaxing, twice, with scripts/tools/verify-removals.py:
    # 30/30 and 25/25 sampled removals returned 404 upstream (plus an earlier
    # independent 8/8), across two separately generated proposals. Those pages
    # are genuinely gone -- keeping them would have the RAG cite dead links.
    #
    # 25% still catches a runaway: a pattern change that orphaned the whole
    # source would propose ~100% and halt.
    max_delete_pct: 0.25
    crawl_delay_seconds: 10
    request_timeout_seconds: 60
    config:
      sitemap_url: https://techdocs.broadcom.com/techdocs2-sitemap.xml
      base_url: https://techdocs.broadcom.com
      parallel_workers: 4
      max_urls_per_run: 900
      include_patterns:
        - '^https://techdocs\.broadcom\.com/us/en/vmware-cis/vcf/vcf-9-0-and-later/'
      exclude_patterns:
        - '/(release-notes|infrastructure-operations|advanced-network-management|administration-sdks-cli-and-tools)'

# ── Global defaults ────────────────────────────────────────────────────────
defaults:
  # Halt a refresh that would delete more than this fraction of a source's
  # existing documents. Write the plan to _proposals/ for operator review.
  max_delete_pct: 0.10

  # Documents per /update-embeddings call.
  #
  # 200 was too large. On 2026-08-24 a 200-document batch against a ~7,600-doc
  # workspace ran past the 1800s client timeout; AnythingLLM finished it
  # server-side, but the client had already aborted, so batches 2-5 were never
  # sent. State had already been persisted (by design, so a failure retries
  # without re-uploading) which left 698 documents uploaded, tracked as done,
  # and NOT attached to the workspace -- invisible to retrieval and invisible
  # to the next refresh, because their hashes matched.
  #
  # Measured at 50: ~40s per batch, ~0.8s/doc. Well inside the timeout with
  # room for the workspace to keep growing.
  embed_batch_size: 50

  # Where per-source state files live. Survives ingest LXC re-creation if on
  # the ZFS pool.
  state_dir: /tank/rag-state

  # AnythingLLM API base URL. Token read from scripts/config.env (ALLM_API_KEY).
  allm_base_url: http://192.168.6.154:3001/api/v1

  # Polite delay between trafilatura HTTP fetches (per source).
  crawl_delay_seconds: 3

  # HTTP request timeout for sitemap / page fetches.
  request_timeout_seconds: 30

  # Embedding pass timeout. Big workspaces with thousands of new chunks need
  # a generous ceiling.
  embed_timeout_seconds: 1800
