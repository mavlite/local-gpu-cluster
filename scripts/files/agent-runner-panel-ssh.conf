# `ssh panel` for sandbox tasks (installed as /etc/ssh/ssh_config.d/agent-runner-panel.conf on VM 178).
# The key is never a file here: it lives in the agent-arma ssh-agent (SSH_AUTH_SOCK, SDG-ARMA3 tasks only), and the
# public half below only selects it. Both /etc/agent-runner-agent files are copied from runner's ~/.ssh at install.
# runner's own ~/.ssh/config is read first, so the dispatcher's `ssh panel` is unchanged.
Host panel
  HostName 10.60.40.10
  User deploy
  IdentityFile /etc/agent-runner-agent/panel.pub
  IdentitiesOnly yes
  UserKnownHostsFile /etc/agent-runner-agent/known_hosts_panel
  StrictHostKeyChecking yes
  BatchMode yes
  ForwardAgent no
  ClearAllForwardings yes
