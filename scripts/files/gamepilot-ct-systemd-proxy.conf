# Every systemd unit on CT 160 (the conductor's own unit, and the runbook's systemd-run checks) gets the proxy.
# The CT firewall rejects everything that does not go through it. The claude CLI is pinned and updated from the
# host (81-lxc-gamepilot.sh), so its auto-updater and non-essential traffic are off. claude.ai connectors (Gmail,
# Drive, ... via mcp-proxy.anthropic.com) are off: triage jobs must not reach the owner's accounts (owner, 2026-10-31).
[Manager]
DefaultEnvironment="https_proxy=http://192.168.6.155:3129" "HTTPS_PROXY=http://192.168.6.155:3129" "http_proxy=http://192.168.6.155:3129" "HTTP_PROXY=http://192.168.6.155:3129" "no_proxy=localhost,127.0.0.1" "NO_PROXY=localhost,127.0.0.1" "DISABLE_AUTOUPDATER=1" "CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1" "ENABLE_CLAUDEAI_MCP_SERVERS=false"
