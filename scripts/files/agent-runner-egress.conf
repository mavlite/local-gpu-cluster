# /etc/agent-runner-agent/egress.conf -- per-repo sandbox egress for agent runner tasks (VM 178).
# Each repo's agent runs as its own user; only these tcp endpoints (plus the router 192.168.6.153:8000 and
# loopback 127.0.0.1/::1) are reachable from its sandbox. IP literals only: the sandbox has no DNS.
# Enforced by systemd IPAddressAllow (per IP) and nftables table inet agent_egress (per uid + IP + port).
# After editing: scripts/78-vm-agent-runner.sh install-vm (re-renders and reloads the nft table).
#
# repo      user        allowed tcp endpoints (IPv4:port)
# SDG-RUST: panel; Wings SFTP patron-us2 (155, 156), patron-us1 (152, 154), play-us2 (157). 2026-11-02: the VPN
# carries routes for 10.60.40.10 and 10.60.20.12 only; 10.60.20.11 and 10.60.30.12 need SDG-IAC to push them.
SDG-RUST    agent-rust  10.60.40.10:80 10.60.20.12:2022 10.60.20.11:2022 10.60.30.12:2022
SDG-ARMA3   agent-arma  10.60.40.10:22
