# tinyproxy instance for the GamePilot conductor (CT 160), on LXC 155 next to the redteam proxy (port 3128).
# Its own port, allowlist, pid and log, so neither instance widens the other's allowlist.
User tinyproxy
Group tinyproxy
Port 3129
Listen 192.168.6.155
Timeout 900
DefaultErrorFile "/usr/share/tinyproxy/default.html"
LogFile "/var/log/tinyproxy/gamepilot.log"
LogLevel Info
PidFile "/run/tinyproxy-gamepilot/tinyproxy.pid"
MaxClients 20
# The conductor reaches 192.168.6.155 through the host's SNAT (gamepilot-net.sh), so it arrives as the host address.
Allow 192.168.6.175
Filter "/etc/tinyproxy/gamepilot-allowlist"
FilterExtended On
FilterDefaultDeny Yes
FilterCaseSensitive Off
# HTTPS (CONNECT) only to 443; plain HTTP is used only by apt for the Debian mirrors.
ConnectPort 443
DisableViaHeader Yes
